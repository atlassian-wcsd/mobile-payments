AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 5

Resources:
  SubmitImageFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: submitImage/
      Handler: bootstrap
      Runtime: provided.al2
      Tracing: Active
      Policies:
        - AmazonDynamoDBFullAccess
        - AmazonS3FullAccess
        - AdministratorAccess
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /bootstrap
            Method: GET
      Tags:
        Name: submitImage
        business_unit: agile_devops_pmm
        service_name: open_devops_image_rec
        resource_owner: wmarusiak

  PaymentMethodsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      CodeUri: submitImage/
      Handler: bootstrap
      Runtime: provided.al2
      Tracing: Active
      Environment:
        Variables:
          HANDLER_MODE: payment
      Policies:
        - AmazonDynamoDBFullAccess
      Events:
        ListMethods:
          Type: Api
          Properties:
            Path: /payment/methods
            Method: GET
        GetMethod:
          Type: Api
          Properties:
            Path: /payment/methods/{methodId}
            Method: GET
        ExpandMethod:
          Type: Api
          Properties:
            Path: /payment/methods/{methodId}/expand
            Method: GET
        RedirectMethod:
          Type: Api
          Properties:
            Path: /payment/methods/{methodId}/redirect
            Method: GET
        SelectMethod:
          Type: Api
          Properties:
            Path: /payment/methods/{methodId}/select
            Method: POST
      Tags:
        Name: paymentMethods
        business_unit: agile_devops_pmm
        service_name: open_devops_payment
        resource_owner: wmarusiak

  PaymentMethodsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PaymentMethods
      AttributeDefinitions:
        - AttributeName: UserId
          AttributeType: S
      KeySchema:
        - AttributeName: UserId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Name
          Value: PaymentMethodsTable
        - Key: service_name
          Value: open_devops_payment

Outputs:
  SubmitImageAPI:
    Description: "API Gateway endpoint URL for Prod environment for Submit Image Function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/bootstrap"
  SubmitImageFunction:
    Description: "First Lambda Function ARN"
    Value: !GetAtt SubmitImageFunction.Arn
  SubmitImageFunctionIamRole:
    Description: "Implicit IAM Role created for Submit Image function"
    Value: !GetAtt SubmitImageFunctionRole.Arn
  SubmitImageFunctionName:
    Description: "SubmitImage function name"
    Value: !Ref SubmitImageFunction
    Export:
      Name: SubmitImageFunctionName
  PaymentMethodsAPI:
    Description: "API Gateway endpoint URL for Prod environment for Payment Methods Function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/payment/methods"
  PaymentMethodsFunction:
    Description: "Payment Methods Lambda Function ARN"
    Value: !GetAtt PaymentMethodsFunction.Arn
  PaymentMethodsFunctionIamRole:
    Description: "Implicit IAM Role created for Payment Methods function"
    Value: !GetAtt PaymentMethodsFunctionRole.Arn
